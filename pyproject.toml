[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpacs-doc"
version = "0.1.0"
description = "Documentation extractor for the CPACS schema"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Deliberately minimal: the extractor must be usable without the viewer and
# without cpacs-schema-tool (N16).
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cpacs-doc = "cpacs_doc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpacs_doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
