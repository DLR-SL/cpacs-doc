name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The schema job checks a repository this one does not control. A weekly run
  # surfaces a change there before it collides with unrelated work here.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both platforms, not just the runner's own: a path defect that only shows
    # on a case-sensitive file system and one that only shows on Windows have
    # both occurred here, and each is invisible on the other platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked
        env:
          UV_PYTHON: ${{ matrix.python }}

      - name: Test
        # The keyboard tests drive a real browser and skip without one. Both
        # runner images carry Chrome, so demand it here rather than let the
        # file lapse into a silent skip.
        run: uv run pytest -q
        env:
          CPACS_DOC_REQUIRE_BROWSER: "1"

  schema:
    # The extractor is only as useful as its verdict on a real schema. This job
    # fails on findings of severity error — in the schema, not in the code.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      # To delete the one-file builds this run supersedes. Nothing else here
      # writes anything: the site leaves as a Pages artifact.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out the CPACS schema
        uses: actions/checkout@v4
        with:
          repository: DLR-SL/CPACS
          ref: improveDocs
          path: cpacs
          # Only the two directories the extractor reads; the full repository is
          # over 100 MB, most of it documentation binaries.
          sparse-checkout: |
            schema
            documentation
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Report
        run: uv run cpacs-doc report cpacs/schema/cpacs_schema.xsd --limit 0

      - name: Build the model, the site and the one file
        run: |
          uv run cpacs-doc build cpacs/schema/cpacs_schema.xsd --site --single -o build
          touch build/.nojekyll
          # Taken out of the Pages tree: what is deployed stays the site, and
          # the one file is 20 MB that no page there links to.
          mkdir single
          mv build/cpacs-doc.html single/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Upload the one file
        uses: actions/upload-artifact@v4
        with:
          # A stable name, which is what makes "keep the newest" below mean
          # anything. The upload is zipped, so it costs about 12 MB of the
          # repository's storage rather than the 20 MB it is on disk.
          name: cpacs-doc-single
          path: single/cpacs-doc.html
          # The backstop, for a branch that stops building before the step
          # below ever runs again on it — a merged pull request, mostly.
          retention-days: 14
          if-no-files-found: error

      - name: Delete the one-file builds this run supersedes
        # Retention alone would keep a fortnight of uploads per branch, and only
        # the newest says anything about the schema as it is now. Deleting after
        # the upload rather than before it means a failed upload cannot leave a
        # branch with nothing to download. A fork's token is read-only and
        # cannot delete; there the retention date is the whole logic.
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/github-script@v7
        with:
          script: |
            const name = "cpacs-doc-single";
            const { owner, repo } = context.repo;
            const { data: current } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, name, per_page: 100 },
            );
            // Per branch: a pull request's own build is not superseded by main's.
            const superseded = artifacts.filter((artifact) =>
              // The name is asked of the API as well; checked again here so a
              // parameter the client drops cannot widen this to other uploads.
              artifact.name === name
              && artifact.workflow_run
              && artifact.workflow_run.head_branch === current.head_branch
              && artifact.workflow_run.id !== current.id
            );
            for (const artifact of superseded) {
              core.info(`deleting ${artifact.id} from run ${artifact.workflow_run.id}`);
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id,
              });
            }
            core.info(`kept this run's ${name}, deleted ${superseded.length} older`);

  preview:
    # A preview of the generated documentation, not a release. It tracks
    # improveDocs, the branch the documentation work is happening on, so it
    # shows the schema as that work leaves it rather than any published
    # version.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: schema
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
